name: Verify packages

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      acceptance-script:
        description: Additional Windows acceptance script, run only on disposable CI machines
        required: false
        type: string

permissions:
  contents: read

jobs:
  native-linux:
    name: native (${{ matrix.runner }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps: &native-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.10.0
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.1
      - run: npm ci
      - run: npm run build
      - run: npm run build:daemon --workspace @axi/env
      - name: Install X11 test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev xvfb xclip dbus-daemon
      - name: Prepare Windows Node development files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p process.version
          $arch = node -p process.arch
          $sdk = Join-Path $env:RUNNER_TEMP 'axi-node-sdk'
          New-Item -ItemType Directory -Force $sdk | Out-Null
          Invoke-WebRequest "https://nodejs.org/dist/$version/node-$version-headers.tar.gz" -OutFile "$sdk/headers.tar.gz"
          tar -xf "$sdk/headers.tar.gz" -C $sdk
          Invoke-WebRequest "https://nodejs.org/dist/$version/win-$arch/node.lib" -OutFile "$sdk/node.lib"
          "NODE_INCLUDE_DIR=$sdk/node-$version/include/node" >> $env:GITHUB_ENV
          "NODE_IMPORT_LIBRARY=$sdk/node.lib" >> $env:GITHUB_ENV
      - name: Build and test the Windows terminal helper
        if: runner.os == 'Windows'
        shell: cmd
        env:
          TARGET_ARCH: ${{ endsWith(matrix.target, 'arm64') && 'arm64' || 'x64' }}
          AXI_TEST_NATIVE_CLIPBOARD: "1"
        run: |
          for /f "tokens=*" %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath') do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" %TARGET_ARCH%
          if errorlevel 1 exit /b 1
          call npm run build:native -w @axi/tui
          if errorlevel 1 exit /b 1
          call npm run test:native -w @axi/tui
      - name: Build and test the terminal helper
        if: runner.os != 'Windows'
        run: npm run build:native -w @axi/tui && npm run test:native -w @axi/tui
      - run: cargo test --locked --manifest-path packages/env/daemon/Cargo.toml
      - run: npm run check
      - name: Run owned tests and coverage checks
        if: matrix.target == 'linux-x64'
        run: |
          npm run test:tooling
          dbus-run-session -- npm run test:coverage
      - name: Run Linux ARM owned tests with a private desktop bus
        if: matrix.target == 'linux-arm64'
        run: dbus-run-session -- npm run test:coverage
      - name: Run owned tests
        if: runner.os != 'Linux'
        run: npm run test:coverage
      - run: npm run coverage:capture
      - name: Run additional Windows acceptance checks
        if: runner.os == 'Windows' && inputs.acceptance-script != ''
        shell: bash
        env:
          AXI_ACCEPTANCE_SCRIPT: ${{ inputs.acceptance-script }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdtempSync, writeFileSync, rmSync } from 'node:fs';
          import { join } from 'node:path';
          import { spawnSync } from 'node:child_process';
          const directory = mkdtempSync(join(process.env.RUNNER_TEMP, 'axi-acceptance-'));
          try {
            const script = join(directory, 'run.mjs');
            writeFileSync(script, process.env.AXI_ACCEPTANCE_SCRIPT);
            const result = spawnSync(process.execPath, [script], { stdio: 'inherit' });
            if (result.error) throw result.error;
            process.exitCode = result.status ?? 1;
          } finally {
            rmSync(directory, { recursive: true, force: true });
          }
          NODE
      - name: Inspect the failed browser environment
        if: failure() && runner.os == 'Linux'
        run: |
          command -v chromium && chromium --version || true
          command -v google-chrome && google-chrome --version || true
          free -m
          cat /sys/fs/cgroup/memory.events /sys/fs/cgroup/pids.events || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: test-coverage-${{ matrix.target }}
          path: coverage
          if-no-files-found: ignore
      - run: npm run pack -- release/package
      - run: npm run verify:packages -- release/package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-${{ matrix.target }}
          path: packages/env/bin
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tui-${{ matrix.target }}
          path: packages/tui/native
          if-no-files-found: error

  native:
    name: native (${{ matrix.runner }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
          - runner: windows-2025
            target: windows-x64
          - runner: windows-11-arm
            target: windows-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps: *native-steps

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-linux-android
            compiler: aarch64-linux-android24-clang
            target: android-arm64
          - triple: x86_64-linux-android
            compiler: x86_64-linux-android24-clang
            target: android-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.10.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.triple }}
      - name: Select the Android linker
        env:
          TARGET: ${{ matrix.triple }}
          COMPILER: ${{ matrix.compiler }}
        run: |
          test -n "$ANDROID_NDK_LATEST_HOME"
          key="CARGO_TARGET_$(echo "$TARGET" | tr '[:lower:]-' '[:upper:]_')_LINKER"
          echo "$key=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$COMPILER" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build:daemon --workspace @axi/env
        env:
          CARGO_BUILD_TARGET: ${{ matrix.triple }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-${{ matrix.target }}
          path: packages/env/bin
          if-no-files-found: error

  android-runtime:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [24, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.10.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-android-x64
          path: packages/env/bin
      - run: npm ci
      - run: npm run build
      - name: Run Env on an Android emulator
        shell: bash
        env:
          API: ${{ matrix.api }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          image="system-images;android-$API;google_apis;x86_64"
          export ANDROID_USER_HOME="$RUNNER_TEMP/axi-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install platform-tools emulator "$image"
          "$sdk/cmdline-tools/latest/bin/avdmanager" create avd --force --name axi-test --device pixel_2 --package "$image" --path "$ANDROID_AVD_HOME/axi-test.avd"
          "$sdk/emulator/emulator" -list-avds
          test -f "$ANDROID_AVD_HOME/axi-test.ini"
          sudo chmod a+rw /dev/kvm
          "$sdk/emulator/emulator" -avd axi-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on -memory 2048 -cores 2 > android-emulator.log 2>&1 &
          emulator=$!
          trap '"$sdk/platform-tools/adb" emu kill || true; kill "$emulator" 2>/dev/null || true' EXIT
          adb="$sdk/platform-tools/adb"
          timeout 120 "$adb" wait-for-device
          deadline=$((SECONDS + 300))
          until test "$("$adb" shell getprop sys.boot_completed | tr -d '\r')" = 1; do
            if ! kill -0 "$emulator" 2>/dev/null || test "$SECONDS" -ge "$deadline"; then cat android-emulator.log; exit 1; fi
            sleep 2
          done
          "$adb" push packages/env/bin/axi-env-android-x64/axi-env /data/local/tmp/axi-env
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang" packages/env/test/fixtures/terminal-size.c -o "$RUNNER_TEMP/axi-terminal-size"
          "$adb" push "$RUNNER_TEMP/axi-terminal-size" /data/local/tmp/axi-terminal-size
          "$adb" shell chmod 700 /data/local/tmp/axi-env /data/local/tmp/axi-terminal-size
          daemon_command=$(node -e 'console.log(JSON.stringify([process.argv[1], "shell", "-T", "-e", "none", "env", "TMPDIR=/data/local/tmp", "/data/local/tmp/axi-env"]))' "$adb")
          node packages/env/test/remote-acceptance.ts "$daemon_command" /system/bin/sh /data/local/tmp/axi-terminal-size | tee android-acceptance.json
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const receipt = JSON.parse(readFileSync('android-acceptance.json', 'utf8'));
          assert.equal(receipt.remote.os, 'android');
          assert.equal(receipt.bytes, 1700000);
          assert.equal(receipt.passed.length, 7);
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: android-runtime-${{ matrix.api }}
          path: |
            android-emulator.log
            android-acceptance.json
          if-no-files-found: error

  compatibility:
    needs: native-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.20.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-linux-x64
          path: packages/env/bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tui-linux-x64
          path: packages/tui/native
      - run: chmod +x packages/env/bin/axi-env-linux-x64/axi-env
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Install the headless browser session bus
        run: sudo apt-get update && sudo apt-get install -y dbus-daemon
      - name: Run owned tests with a private desktop bus
        run: dbus-run-session -- npm test
      - name: Inspect the failed browser environment
        if: failure()
        run: |
          command -v chromium && chromium --version || true
          command -v google-chrome && google-chrome --version || true
          free -m
          cat /sys/fs/cgroup/memory.events /sys/fs/cgroup/pids.events || true
      - run: npm run pack -- release/package
      - run: npm run verify:packages -- release/package

  archive:
    needs: [native-linux, native, android, android-runtime, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.10.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: native-*
          path: packages/env/bin
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: tui-*
          path: packages/tui/native
          merge-multiple: true
      - run: find packages/env/bin -type f -name axi-env -exec chmod +x {} +
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: test-coverage-*
          path: coverage/native
      - run: npm run coverage:merge -- coverage/native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: combined-coverage
          path: coverage/combined
          if-no-files-found: error
      - name: Check native coverage
        run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 android-x64 android-arm64; do test -x "packages/env/bin/axi-env-$target/axi-env"; done
          for target in windows-x64 windows-arm64; do test -s "packages/env/bin/axi-env-$target/axi-env.exe"; done
          for platform in linux darwin win32; do
            suffix=""; if test "$platform" = linux; then suffix=-x11; fi
            for arch in x64 arm64; do test -s "packages/tui/native/$platform/prebuilds/$platform-$arch/$platform-platform$suffix.node"; done
          done
      - run: npm ci --prefix test/workers --ignore-scripts
      - run: npm run test:workers
      - run: npm run pack -- release/package
      - run: npm run verify:packages -- release/package
      - name: Create the archive
        run: |
          version=$(node -p 'require("./package.json").version')
          tar -C release/package -czf "release/axi-toolkit-$version.tar.gz" .
          cd release
          sha256sum "axi-toolkit-$version.tar.gz" > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: axi-toolkit
          path: |
            release/*.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: archive
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: axi-toolkit
          path: release
      - name: Create a draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/SHA256SUMS --draft --generate-notes
